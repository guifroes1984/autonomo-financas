<nav class="app-header">
    <div class="container-fluid header-conteudo">

        <div class="header-esquerda">

            <button type="button" class="menu-toggle" aria-label="Abrir ou recolher menu" (click)="abrirMenu()">

                <i class="bi bi-list"></i>

            </button>

            <div class="header-marca">

                <span class="header-titulo">
                    Autônomo Finanças
                </span>

                <span class="header-subtitulo">
                    Controle financeiro
                </span>

            </div>

        </div>

        <div class="usuario-menu">

            <button type="button" class="usuario-avatar" aria-label="Abrir menu do usuário"
                (click)="alterarMenuUsuario()">

                <span class="usuario-avatar-iniciais">
                    {{ perfil()?.nome?.charAt(0)?.toUpperCase() || 'U' }}
                </span>

                <span class="usuario-dados">
                    <strong>
                        {{ perfil()?.nome || 'Usuário' }}
                    </strong>

                    <small>
                        Minha conta
                    </small>
                </span>

                <i class="bi bi-chevron-down usuario-seta"></i>

            </button>

            @if (menuUsuarioAberto()) {

            <div class="usuario-dropdown">

                @if (perfil()) {

                <div class="usuario-info">

                    <strong>
                        {{ perfil()!.nome }}
                    </strong>

                    <small>
                        {{ perfil()!.email }}
                    </small>

                </div>

                <div class="dropdown-divider"></div>

                }

                <button type="button" class="usuario-dropdown-item" (click)="abrirPerfil()">

                    <i class="bi bi-person"></i>
                    Meu perfil

                </button>

                <div class="dropdown-divider"></div>

                <button type="button" class="usuario-dropdown-item usuario-sair" (click)="sair()">

                    <i class="bi bi-box-arrow-right"></i>
                    Sair

                </button>

            </div>

            }

        </div>

    </div>
</nav>
